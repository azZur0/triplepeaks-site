  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{page_title}}</title>
  <meta name="description" content="{{page_description}}">
  <meta name="apple-itunes-app" content="app-id=6758676538">
  <link rel="canonical" href="{{canonical}}">
  {{hreflang}}
  {{head_extra}}
  <!-- Social share preview (Open Graph + Twitter/X). An explicit og:image stops
       LinkedIn/Facebook/Slack from scraping a random app screenshot. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{site_name}}">
  <meta property="og:locale" content="{{og_locale}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:title" content="{{page_title}}">
  <meta property="og:description" content="{{page_description}}">
  <meta property="og:image" content="{{og_image}}">
  <meta property="og:image:secure_url" content="{{og_image}}">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{og_image_alt}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{page_title}}">
  <meta name="twitter:description" content="{{page_description}}">
  <meta name="twitter:image" content="{{og_image}}">
  <meta name="twitter:image:alt" content="{{og_image_alt}}">
  <link rel="icon" href="/img/favicon.ico">
  <!-- Fonts are self-hosted (see css/style.css), so the site makes no third-party requests. -->
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/style.css">
